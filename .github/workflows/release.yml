name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt pyyaml
      - run: make check && python scripts/check_skill.py
      - name: tag matches the code version
        run: |
          code=$(python -c "import sys; sys.path.insert(0,'scripts'); from scifraudscan import __version__; print(__version__)")
          [ "v$code" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$code"; exit 1; }
      - run: make package
      - run: gh release create "$GITHUB_REF_NAME" dist/scifraudscan.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
