name: Bug report
description: A check crashed, or gave a result the method says it should not
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `python scripts/scan.py --version`
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - False flag on honest / correctly computed numbers
        - Missed a known inconsistency
        - Crash or error
        - Skill behaviour (what Claude said)
        - Other
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Smallest input that reproduces it
      description: The CSV rows and the exact command. Numbers only; do not name the authors of the data.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
