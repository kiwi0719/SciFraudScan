version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: pip
    directory: /
    # requirements*.txt are lower bounds for people installing the skill into
    # their own environment; only move one when the old bound stops working
    versioning-strategy: increase-if-necessary
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
